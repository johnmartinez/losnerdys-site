title: Los Nerdys
description: "Where latinidad and nerdiness intersect. Tech, cultura, y un chingo de curiosidad."
url: https://losnerdys.tech
baseurl: ""

# Get Into: the YouTube playlist, linked from /getinto/. Each guide links its own video with `youtube:` in its front matter.
getinto_playlist: https://www.youtube.com/playlist?list=PLdnjw6x8ktc0

plugins:
  - jekyll-redirect-from

collections:
  getinto:
    output: true

defaults:
  - scope: { type: getinto }
    values: { layout: guide, nav: getinto }

exclude:
  - tools
  - reference
  - HANDOFF.md
  - README.md
  - spec.md
  - .prep-drafts
  - .claude
  - node_modules
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor
