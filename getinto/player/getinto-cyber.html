<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Into | Los Nerdys</title>
<!-- GETINTO ENGINE v2 (2.5D, Three.js)
     One deterministic timeline, two layouts (landscape 16:9, portrait 9:16).
     Data comes from the #guide JSON block (filled by build.mjs).
     Modes:
       ?render&format=landscape|portrait  video renderer (Playwright steps renderAt(t))
       ?embed[&format=...]                inside an iframe on the site: no switcher; parent can
                                          postMessage {type:'getinto', format|replay}
       (none)                             standalone page with Desktop | Mobile switcher
     Frame 0 is a finished title frame. Web modes play once and hold on the finished stack
     (no outro), with a player bar (restart, back, play/pause, forward, scrub, sound, volume).
     Video mode ends on the logo outro.
     postMessage from the parent: {type:'getinto', format, cmd:'play|pause|toggle|restart|next|prev', seek, muted, volume} -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0b0814; --surface:#161029; --line:#2b2145; --text:#ece7f7; --muted:#a59bbf;
  --title:#39ff88; --rosa:#ff2d95; --cyan:#22e3f5; --marigold:#ffb11f; --violet:#9b5cff; --on-rosa:#12061a;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); }

#viewport { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#switcher { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:50;
  display:flex; gap:4px; padding:4px; border-radius:999px;
  background:color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter:blur(10px);
  border:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:13px; }
#switcher button { all:unset; cursor:pointer; padding:6px 14px; border-radius:999px; color:var(--muted); font-weight:800; letter-spacing:.3px; }
#switcher button:hover { color:var(--text); }
#switcher button[aria-pressed="true"] { background:var(--rosa); color:var(--on-rosa); }
#switcher button:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
.rendering #switcher, .embedded #switcher { display:none; }

/* player bar */
#controls { position:fixed; z-index:60; left:0; top:0; padding:6px 10px 8px; border-radius:14px; color:var(--text);
  background:color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line); font-family:'JetBrains Mono', monospace; transition:opacity .25s ease; user-select:none; -webkit-user-select:none; }
#controls[hidden], .rendering #controls { display:none; }
#controls.auto { opacity:0; pointer-events:none; }
#controls.auto.show { opacity:1; pointer-events:auto; }
#scrub { position:relative; height:18px; cursor:pointer; touch-action:none; outline:none; }
#scrubTrack { position:absolute; left:0; right:0; top:7px; height:4px; border-radius:99px; background:rgba(165,155,191,.28); overflow:hidden; }
#scrubFill { position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg, var(--cyan), var(--violet), var(--rosa), var(--title)); background-size:var(--scrub-w, 600px) 100%; }
#scrubTicks i { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--bg); }
#scrubKnob { position:absolute; top:3px; width:12px; height:12px; margin-left:-6px; border-radius:99px; background:var(--text); box-shadow:0 0 10px rgba(255,45,149,.7); }
#scrub:focus-visible #scrubKnob { outline:2px solid var(--cyan); outline-offset:2px; }
#controls .crow { display:flex; align-items:center; gap:4px; margin-top:2px; }
#controls button { all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; height:38px; min-width:38px; border-radius:99px; color:var(--text); }
#controls button:hover { color:var(--rosa); background:rgba(255,255,255,.05); }
#controls button:focus-visible { outline:2px solid var(--cyan); outline-offset:-2px; }
#controls svg { width:22px; height:22px; fill:currentColor; display:block; }
#controls #cPlay { background:var(--rosa); color:var(--on-rosa); margin:0 2px; }
#controls #cPlay:hover { background:var(--rosa); color:var(--on-rosa); box-shadow:0 0 16px rgba(255,45,149,.6); }
#controls[data-state="playing"] .i-play, #controls:not([data-state="playing"]) .i-pause { display:none; }
#controls[data-sound="on"] .i-off, #controls:not([data-sound="on"]) .i-on { display:none; }
#controls #cMute { padding:0 10px 0 8px; }
#cMute .lbl { font-size:12px; font-weight:800; letter-spacing:.3px; }
#controls:not([data-sound="on"]) #cMute { color:var(--marigold); box-shadow:inset 0 0 0 1px rgba(255,177,31,.55); }
#controls[data-sound="on"] #cMute .lbl { display:none; }
#controls[data-sound="on"] #cMute, #cTime { font-size:13px; color:var(--muted); margin-left:8px; white-space:nowrap; font-variant-numeric:tabular-nums; }
#controls .grow { flex:1; }
#cVol { width:92px; height:22px; accent-color:var(--rosa); cursor:pointer; margin:0 4px 0 2px; }
#controls.compact button { height:36px; min-width:34px; }
#controls.compact #cTime { display:none; }
#controls.compact #cVol { width:64px; }
#controls.compact #cMute .lbl { display:none; }
#controls.noaudio #cMute, #controls.noaudio #cVol { display:none; }

#stage { position:relative; flex:none; overflow:hidden; background:var(--bg);
  font-family:'Figtree', sans-serif; color:var(--text); transform-origin:center center; }
.landscape #stage { width:1280px; height:720px; }
.portrait  #stage { width:1080px; height:1920px; }
.layer { position:absolute; inset:0; pointer-events:none; }
.mono { font-family:'JetBrains Mono', monospace; }
#gl { position:absolute; inset:0; width:100%; height:100%; display:block; }
#glowA { background: radial-gradient(60% 45% at 10% 6%, rgba(255,45,149,.20), transparent 70%); mix-blend-mode:screen; }
#glowB { background: radial-gradient(60% 45% at 94% 96%, rgba(34,227,245,.13), transparent 70%); mix-blend-mode:screen; }
#scan { background: repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px); }
#vignette { background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.6) 100%); }
#fx { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
#fx path { fill:none; stroke-linecap:round; stroke-linejoin:round; }
.cursor { display:inline-block; width:.58em; height:1em; vertical-align:-0.12em; background:var(--title); margin-left:.06em; }

/* logo: one element, moved between title / header / outro poses */
#cal { position:absolute; left:0; top:0; transform-origin:0 0; z-index:6; will-change:transform;
  filter: drop-shadow(0 0 22px rgba(255,45,149,.45)) drop-shadow(0 0 46px rgba(34,227,245,.18)); }

/* title frame */
#titleCard { position:absolute; transform-origin:0 0; z-index:3; }
#prompt { color:var(--muted); white-space:pre; }
#prompt .p { color:var(--cyan); } #prompt .c { color:var(--text); }
#title { font-weight:800; color:var(--title); white-space:pre; line-height:1.0;
  text-shadow:0 0 20px rgba(57,255,136,.5), 0 0 54px rgba(57,255,136,.28); }
#sub { font-weight:700; } #sub b { color:var(--rosa); font-weight:700; }

/* header while the stack builds */
#header { position:absolute; z-index:3; white-space:pre; }
#hTitle { font-weight:800; color:var(--title); text-shadow:0 0 14px rgba(57,255,136,.45); }
#pips { position:absolute; z-index:3; display:flex; align-items:center; }
#pips .pip { position:relative; border-radius:99px; background:rgba(165,155,191,.22); overflow:hidden; }
#pips .pip i { position:absolute; left:0; top:0; bottom:0; border-radius:99px; }
#pips .count { color:var(--muted); font-weight:800; }

/* focus card: one pillar at a time */
#card { position:absolute; z-index:3; border-radius:18px; background:rgba(22,16,41,.90); border:1px solid var(--line);
  box-shadow: 0 0 0 1px rgba(255,255,255,.02), 0 18px 50px rgba(0,0,0,.5); overflow:hidden; }
#card .bar { position:absolute; left:0; top:0; bottom:0; }
#card .top { display:flex; align-items:baseline; white-space:nowrap; }
#card .num { font-weight:800; color:var(--marigold); }
#card .name { font-weight:800; letter-spacing:-1px; }
#card .count { margin-left:auto; color:var(--muted); font-weight:800; }
#card .desc { font-weight:500; line-height:1.3; }
#card .desc span { display:inline-block; white-space:pre; }

/* recap rows */
#rows { position:absolute; left:0; top:0; z-index:3; }
.row { position:absolute; white-space:nowrap; display:flex; }
.row .rnum { font-family:'JetBrains Mono', monospace; font-weight:800; color:var(--marigold); }
.row .rname { font-family:'JetBrains Mono', monospace; font-weight:800; letter-spacing:-.5px; }
.row .rdesc { font-weight:500; }
#why { position:absolute; z-index:3; color:var(--muted); white-space:pre; }
#why .k { color:var(--title); font-weight:800; text-shadow:0 0 12px rgba(57,255,136,.4); }

/* outro */
#outroBg { background: rgba(11,8,20,.93); z-index:5; }
#url { position:absolute; left:0; right:0; text-align:center; z-index:6; font-weight:800; color:var(--title);
  text-shadow:0 0 16px rgba(57,255,136,.45); white-space:pre; }
#tag { position:absolute; left:0; right:0; text-align:center; z-index:6; font-weight:700; color:var(--rosa);
  letter-spacing:3px; text-transform:uppercase; }
#vignette, #scan { z-index:8; }

/* ---------- landscape 1280x720 ---------- */
.landscape #titleCard { left:80px; top:228px; }
.landscape #prompt { font-size:23px; }
.landscape #title { font-size:118px; letter-spacing:-3px; margin-top:12px; }
.landscape #sub { font-size:30px; margin-top:18px; }
.landscape #header { left:164px; top:50px; }
.landscape #hTitle { font-size:32px; letter-spacing:-.5px; }
.landscape #pips { right:80px; top:62px; gap:8px; }
.landscape #pips .pip { width:54px; height:8px; }
.landscape #pips .count { font-size:16px; margin-left:8px; }
.landscape #card { left:700px; width:500px; padding:30px 36px 32px 44px; }
.landscape #card .bar { width:7px; }
.landscape #card .top { gap:16px; }
.landscape #card .num { font-size:30px; }
.landscape #card .name { font-size:56px; }
.landscape #card .count { font-size:16px; }
.landscape #card .desc { font-size:31px; margin-top:14px; }
.landscape .row { align-items:baseline; gap:14px; }
.landscape .row .rnum { font-size:21px; }
.landscape .row .rname { display:none; }
.landscape .row .rdesc { font-size:27px; }
.landscape #why { font-size:24px; }
.landscape #url { top:428px; font-size:36px; }
.landscape #tag { top:490px; font-size:22px; }

/* ---------- portrait 1080x1920 ----------
   Content stays inside the IG/TikTok/Shorts safe zone:
   clear of the top ~200px, bottom ~380px (captions, buttons), right ~120px (like/share rail). */
.portrait #titleCard { left:72px; top:408px; }
.portrait #prompt { font-size:33px; }
.portrait #title { font-size:164px; letter-spacing:-5px; margin-top:16px; }
.portrait #sub { font-size:44px; margin-top:24px; }
.portrait #header { left:186px; top:230px; }
.portrait #hTitle { font-size:50px; letter-spacing:-1px; }
.portrait #pips { left:72px; top:334px; gap:12px; }
.portrait #pips .pip { width:120px; height:12px; }
.portrait #pips .count { font-size:26px; margin-left:14px; }
.portrait #card { left:72px; width:888px; padding:44px 48px 48px 62px; border-radius:24px; }
.portrait #card .bar { width:11px; }
.portrait #card .top { gap:24px; }
.portrait #card .num { font-size:50px; }
.portrait #card .name { font-size:96px; letter-spacing:-2px; }
.portrait #card .count { font-size:26px; }
.portrait #card .desc { font-size:53px; margin-top:20px; }
.portrait .row { flex-wrap:wrap; align-items:baseline; column-gap:18px; row-gap:4px; padding-left:26px; border-left:8px solid; }
.portrait .row .rnum { font-size:36px; }
.portrait .row .rname { font-size:42px; }
.portrait .row .rdesc { flex-basis:100%; font-size:37px; }
.portrait #why { font-size:34px; }
.portrait #url { top:1050px; font-size:58px; }
.portrait #tag { top:1140px; font-size:36px; }
</style>
</head>
<body class="landscape">
<script id="guide" type="application/json">{"slug":"cyber","title":"Cyber","short":"Cyber","pillars":[{"name":"OS","desc":"Linux o Windows. Learn one, and learn it well."},{"name":"Networking","desc":"TCP/IP. HTTP es la puerta, but go deeper."},{"name":"Code","desc":"Any language. Python is a great start."},{"name":"AI","desc":"Skills, connectors, agents. Not just prompts."},{"name":"Security","desc":"Now learn how each layer breaks."}]}</script>
<nav id="switcher" aria-label="Video format">

<div id="controls" hidden>
  <div id="scrub" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0"><div id="scrubTrack"><div id="scrubFill"></div><div id="scrubTicks"></div></div><div id="scrubKnob"></div></div>

    <button type="button" id="cPrev" aria-label="Back one step" title="Back one step (left arrow)"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg></button>
    <button type="button" id="cPlay" aria-label="Pause" title="Play / pause (space)"><svg class="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>

    <input id="cVol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" title="Volume">
  </div>
</div>

</div>
